name: Stufe 1 - Schnell-Audit (Syft + Trivy)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Vollständiger GitHub-Link (z. B. https://github.com)'
        required: true
        type: string

jobs:
  Stufe-1-Schnell-Audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Ziel-Repo einlesen
        run: |
          CLEAN_URL=$(echo "${{ github.event.inputs.repo_url }}" | xargs)
          git clone --depth 1 "$CLEAN_URL" target-repo
          mkdir -p reports-stufe-1

      - name: 2. Syft (Alle direkten & indirekten Abhängigkeiten)
        uses: anchore/sbom-action@v0
        with:
          path: './target-repo'
          format: 'cyclonedx-json'
          output-file: './reports-stufe-1/1-abhaengigkeiten-sbom.json'

      - name: 3. Trivy – Sicherheitslücken & Secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './target-repo'
          scanners: 'vuln,secret'
          format: 'table'
          output: './reports-stufe-1/2-trivy-sicherheit.txt'

      - name: 4. Trivy – Alle Lizenzen + Profi-Zusammenfassung
        run: |
          trivy fs --scanners license --format table --output ./reports-stufe-1/3-trivy-lizenzen.txt ./target-repo
          trivy fs --scanners license --format json --output trivy-lic.json ./target-repo
          python3 -c "
          import json
          from collections import Counter
          data = json.load(open('trivy-lic.json'))
          lics = Counter()
          for r in data.get('Results', []):
              for l in r.get('Licenses', []):
                  lics[l.get('Name', 'Unbekannt')] += 1
          with open('./reports-stufe-1/4-lizenz-uebersicht.txt', 'w') as f:
              f.write('GEFUNDENE LIZENZEN IM UEBERBLICK:\n' + '='*35 + '\n')
              if not lics:
                  f.write('Keine direkten Lizenz-Dateien gefunden.\n')
              for name, count in lics.most_common():
                  f.write(f'{count}x  {name}\n')
          "

      - name: 5. Ergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ergebnis-Stufe-1-Schnell-Audit
          path: ./reports-stufe-1/
