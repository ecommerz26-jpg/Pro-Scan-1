name: Stufe 1 - Schnell-Audit (Syft + Trivy)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Vollständiger GitHub-Link (z. B. https://github.com)'
        required: true
        type: string

jobs:
  Stufe-1-Schnell-Audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Ziel-Repo einlesen
        run: |
          CLEAN_URL=$(echo "${{ github.event.inputs.repo_url }}" | xargs)
          git clone --depth 1 "$CLEAN_URL" target-repo
          mkdir -p reports-stufe-1

      - name: 2. Syft (Alle direkten & indirekten Abhängigkeiten)
        uses: anchore/sbom-action@v0
        with:
          path: './target-repo'
          format: 'cyclonedx-json'
          output-file: './reports-stufe-1/1-abhaengigkeiten-sbom.json'

      - name: 3. Trivy – Sicherheitslücken & Secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './target-repo'
          scanners: 'vuln,secret'
          format: 'table'
          output: './reports-stufe-1/2-trivy-sicherheit.txt'

      - name: 4. Trivy & Syft – Komplette Lizenz-Übersicht + Profi-Warnungen
        run: |
          trivy fs --scanners license --license-full --format json --output trivy-lic.json ./target-repo
          python3 -c "
          import json
          from collections import Counter

          lics = Counter()
          rot_warnungen = []
          gelb_hinweise = []

          kritisch = ('GPL', 'AGPL', 'SSPL', 'EUPL', 'CPAL', '-NC')
          vorsicht = ('LGPL', 'MPL')

          # 1. Alle Paket-Lizenzen aus Syft (Direkt & Indirekt) prüfen
          sbom = json.load(open('./reports-stufe-1/1-abhaengigkeiten-sbom.json'))
          for comp in sbom.get('components', []):
              pkg_name = f\"{comp.get('name')} ({comp.get('version', '')})\"
              for l in comp.get('licenses', []):
                  lic_id = l.get('license', {}).get('id') or l.get('license', {}).get('name') or l.get('expression')
                  if lic_id:
                      lics[lic_id] += 1
                      up = lic_id.upper()
                      if any(v in up for v in vorsicht):
                          gelb_hinweise.append(f'[PAKET] {lic_id} -> {pkg_name}')
                      elif any(k in up for k in kritisch):
                          rot_warnungen.append(f'[PAKET] {lic_id} -> {pkg_name}')

          # 2. Alle Datei-Lizenzen aus Trivy prüfen
          tdata = json.load(open('trivy-lic.json'))
          for r in tdata.get('Results', []):
              target = r.get('Target', 'Unbekannt')
              for l in r.get('Licenses', []):
                  name = l.get('Name')
                  pfad = l.get('FilePath') or target
                  if name:
                      lics[name] += 1
                      up = name.upper()
                      if any(v in up for v in vorsicht):
                          gelb_hinweise.append(f'[DATEI] {name} -> {pfad}')
                      elif any(k in up for k in kritisch):
                          rot_warnungen.append(f'[DATEI] {name} -> {pfad}')

          with open('./reports-stufe-1/4-lizenz-uebersicht.txt', 'w') as f:
              f.write('KOMPLETTE LIZENZ-UEBERSICHT (PAKETE + DATEIEN):\n' + '='*50 + '\n')
              for name, count in lics.most_common():
                  f.write(f'{count}x  {name}\n')

              f.write('\n' + '='*50 + '\n')
              if rot_warnungen:
                  f.write('ROT (ACHTUNG - GPL / AGPL / NON-COMMERCIAL):\n')
                  for w in sorted(set(rot_warnungen)):
                      f.write(f'  * {w}\n')
              else:
                  f.write('GRUENES LICHT: Keine roten Lizenzen (GPL/AGPL/NC) gefunden!\n')

              if gelb_hinweise:
                  f.write('\nGELB (HINWEIS - LGPL / MPL SEPARAT EINBINDEN):\n')
                  for g in sorted(set(gelb_hinweise)):
                      f.write(f'  * {g}\n')
          "

      - name: 5. Ergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ergebnis-Stufe-1-Schnell-Audit
          path: ./reports-stufe-1/
